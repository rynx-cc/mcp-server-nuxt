name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: CLI smoke
        run: |
          node dist/index.js --version
          node dist/index.js --help
      - name: pnpm pack smoke
        shell: bash
        run: |
          set -e
          T=$(mktemp -d)
          pnpm pack
          TGZ=$(ls mcp-server-nuxt-*.tgz | head -1)
          cd "$T"
          # Minimal consumer package (avoid pnpm init writing a different packageManager)
          printf '%s\n' '{"name":"pack-smoke","private":true}' > package.json
          pnpm add "$GITHUB_WORKSPACE/$TGZ"
          pnpm exec mcp-server-nuxt --version
